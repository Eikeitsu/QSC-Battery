# 省电策略（独立于停充阈值）。修改即时生效，无需重启。
# 文档：docs/guide/config.md · 省电

#------------------------------
# 总开关与档位
#------------------------------

# 省电模式：1=开（推荐）0=关（全程用 loop_interval_sec，最费电）
power_saver=1

# 档位：balanced=均衡（默认） aggressive=强力过夜 custom=手调下列秒数
power_profile=balanced

# 息屏加强：未插电且判定息屏时放大 idle、暂停动态简介刷新
screen_off_saver=1
# 连续息屏满此秒数才进入「息屏加强」模式（默认 90，防亮灭闪动）；0=立刻
screen_off_enter_sec=90

# 夜间省电：命中 night_schedule 时直接按深睡参数驻停（与「息屏满 10 分钟再深睡」是两条路）
night_saver=0
# 夜间时段（可多行 HH:MM-HH:MM，支持跨天如 23:00-07:00）
night_schedule=23:00-07:00

# 深睡：未插电且息屏已持续 deep_after_sec（默认 600）时用 deep_*；
# 夜间开启时不要求先息屏满 10 分钟。层级：夜间/深睡 ⊃ 息屏加强，不是互斥三态。
deep_idle_enable=1
deep_after_sec=600
deep_idle_sec=900
deep_full_gap_sec=7200

# 心跳写盘间隔（秒）；强力档会拉长
heartbeat_sec=180

# 息屏探测是否允许低频 dumpsys（默认关，避免费电）
screen_probe_dumpsys=0

#------------------------------
# 循环间隔（custom 档或覆盖用；balanced/aggressive 启动时按档位填默认）
#------------------------------

# 接近停充阈值时的短间隔
loop_interval_sec=3
# 停充维持间隔；MCA 持锁仍按此项重申（不会被 DeepPark 拉长）
loop_interval_maintain_sec=30
# 未插电（无守护放大时）
loop_interval_idle_sec=90
# 未插电 + qscd：插拔由 uevent 叫醒，此项为超时兜底
loop_interval_idle_native_sec=600
# 插电且离阈值较远
loop_interval_plugged_sec=15
# 插电 + watch 守护兜底
loop_interval_plugged_native_sec=90
# 「接近阈值」窗口（%）
loop_interval_near_window=3

#------------------------------
# 守护 / 简介 / 持锁
#------------------------------

native_daemon=1
# rust / c / off
native_impl=rust

# 动态简介：1=刷新管理器文案；0=固定产品简介并停 worker（更省、更利 Doze）
description_enable=1

# 动态简介按需刷新：仅当 Magisk/KSU/APatch/MMRL 等管理器在前台时勤刷电量；
# 无人看列表时几乎不更新电量（停充/插拔等状态突变仍会写）。打开管理器会立即对齐。
# 可选追加包名（逗号分隔）。随机/隐藏包名会尽量自动识别：
# Magisk←magisk.db requester；KSU/SukiSU Spoofed←ksud debug package 或 libksud.so。
#desc_viewer_pkgs=

# 停充持锁：0=关 1=开（持续持锁，会挡 Doze）
# auto=魅族或 MCA 机在息屏/夜间才持锁，亮屏释放；非目标机不持锁
# 未插电时模块会强制释放，不挡日常 Doze
stop_hold_wakelock=auto

# 省电诊断（默认关）：touch data/diagnostic_on 后按心跳写 service_power_stats
# 与日志「省电统计」；测完请删除该文件，避免额外写盘。
