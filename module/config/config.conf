#以下所有配置参数修改即时生效，无需重启。日志文件位于 data/log.log，触发功能才会有日志。

#------------------------------

#停止充电电量：电量>=该数值时停止充电，填写范围：停止充电电量 > 恢复充电电量，范围填错无效，填110可关闭此功能。
power_stop=100

#恢复充电电量：电量<=该数值时恢复充电，填写范围：停止充电电量 > 恢复充电电量，建议间隔5-10以内。
#部分系统因休眠机制逻辑差异，当触发停止充电后且仍然插着充电器时，系统会持续唤醒，所以数值不要填太小，建议与停止充电电量间隔5-10以内，拔掉充电器后，则不会持续唤醒。大部分系统没有这种影响，插着充电器也不会持续唤醒。
#澎湃OS 3.0/红米K90至尊版K90U（骁龙8至尊版）用户注意：澎湃OS 3.0休眠策略较激进，建议power_stop与power_start间隔至少10，且power_stop_time不要填太大。若本机存在 MCA handle_state，安装/启动时会写入 data/device.profile 并仅对该机启用 MCA 优先停充与重申。
#仅由本模块自身触发的停止充电之后才能触发恢复充电。
power_start=95

#延时功能：触发停止充电前，先继续充电一段时间，再停止充电，默认值3为3秒(仅可填大于0的整数)，此功能一旦触发，倒计时中，无法停止，只有等待该倒计时结束后，才会触发停止充电，立即生效，谨慎填写。
#模块中的每一轮'停止充电'至'恢复充电'，只会触发一次延时功能。
#部分系统有休眠机制，如果系统正在休眠，延时时间会比你填的时间更长(长很多)，所以建议时间不要填太长。
power_stop_time=3

#充满再停：开启填1，关闭填0，(个别机型不支持,自测)。当'停止充电电量'且当前电量都为100时，则等涓流充电结束后充满(电流小于100ma)再停止充电。注意，若电流一直不下降至100ma以下，则不会停止充电。开启该功能后，模块'延时功能'自动失效。
charge_full=0

#自动拔插：开启填1，关闭填0。每次充电时模块再自动拔插一次，用以解决个别机型充电时无法激活快充，需要再一次拔插充电才能激活快充的问题。
power_reset=0

#兼容模式：开启填1，关闭填0。与其它快充/限流模块同装时建议开启。开启后跳过本模块电流控制（即使已安装电流控制组件），仅保留电量/温度停充。
Compatibility_mode=0

#------------------------------

#开关温控模式：开启填1，关闭填0。
temperature_switch=1

#开关温控-停止充电温度：电池温度>=该数值时停止充电，填写范围：停止充电温度 > 恢复充电温度，范围填错无效。
temperature_switch_stop=60

#开关温控-恢复充电温度：电池温度<=该数值时恢复充电，填写范围：停止充电温度 > 恢复充电温度，建议间隔3度以上。
#仅由本模块自身触发的停止充电之后才能触发恢复充电。
temperature_switch_start=50

#------------------------------

#供电开关文件路径：自动扫描无效或效果不佳时，自行填入可用充电开关，每行一个。
#格式：power_switch=[文件路径 start=开值 stop=关值]
#空格可用 :: 代替（如 MTK current_cmd：start=0::0 stop=0::1）。填入后优先于全量扫描。
#示例（按需取消注释，勿照抄无效节点）：
#power_switch=[/sys/class/power_supply/battery/charge_charger_state start=1 stop=0]
#power_switch=[/sys/class/power_supply/battery/connect_disable start=0 stop=1]
#power_switch=[/sys/class/power_supply/battery/batt_slate_mode start=0 stop=1]
#power_switch=[/sys/class/power_supply/battery/store_mode start=0 stop=1]
#power_switch=[/sys/class/power_supply/battery/input_suspend start=0 stop=1]
#power_switch=[/sys/class/power_supply/battery/night_charging start=0 stop=1]
#power_switch=[/sys/class/power_supply/main/adapter_cc_mode start=0 stop=1]
#power_switch=[/sys/class/power_supply/main/cool_mode start=0 stop=1]
#power_switch=[/sys/class/qcom-battery/input_suspend start=0 stop=1]
#power_switch=[/sys/class/qcom-battery/charging_suspend_battery start=0 stop=1]
#power_switch=[/sys/class/qcom-battery/night_charging start=0 stop=1]
#power_switch=[/sys/class/asuslib/charging_suspend_en start=0 stop=1]
#power_switch=[/sys/class/hw_power/charger/charge_data/enable_charger start=1 stop=0]
#power_switch=[/sys/devices/platform/lge-unified-nodes/charging_enable start=1 stop=0]
#power_switch=[/sys/devices/platform/mt-battery/disable_charger start=0 stop=1]
#power_switch=[/sys/devices/virtual/oplus_chg/battery/mmi_charging_enable start=1 stop=0]
#power_switch=[/sys/class/power_supply/idt/pin_enabled start=1 stop=0]
#power_switch=[/sys/kernel/debug/google_charger/chg_suspend start=0 stop=1]
#power_switch=[/sys/kernel/debug/google_charger/chg_mode start=1 stop=0]
#power_switch=[/sys/kernel/nubia_charge/charger_bypass start=off stop=on]
#power_switch=[/proc/driver/charger_limit_enable start=0 stop=1]
#power_switch=[/proc/driver/charger_limit start=100 stop=1]
#power_switch=[/proc/mtk_battery_cmd/current_cmd start=0::0 stop=0::1]
#power_switch=[/proc/mtk_battery_cmd/en_power_path start=1 stop=0]
#power_switch=[/sys/class/power_supply/usb/input_suspend start=0 stop=1]
#power_switch=[/sys/class/power_supply/ac/device/power_supply/usb/power_switch start=1 stop=0]
#power_switch=[/sys/class/power_supply/ac/device/power_supply/usb/input_suspend start=0 stop=1]

#------------------------------

#在模块根目录下的「打开充电控制.sh」和「关闭充电控制.sh」可复制到第三方软件（如 Anywhere 控制中心磁贴）实现快捷开关。
#也可通过 WebUI 或编辑 config/config.conf 修改以上参数。
#电流控制（若安装时选择）配置见 config/current.json；电流节点字段为 battery_current。
