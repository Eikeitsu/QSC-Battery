# 通知配置（独立文件）。修改即时生效。

# 停充/恢复通知：1=开 0=关（默认关）
notify_charge_event=0

# 通知种类：逗号分隔 stop,resume,fail；留空=三种都发
notify_charge_kinds=stop,resume,fail

# 勿扰时段：时段内不发停充/恢复（失败仍发）。可多行 HH:MM-HH:MM
#notify_quiet_schedule=22:00-07:00

# 常显功耗通知：状态栏常驻电量/温度/电流（默认关，费电）
notify_power_status=0

# —— 低电/过温防护（冷门；阈值 0=关，默认全关，关时零额外开销）——
# 启用建议：warn=15 shutdown=5 temp=55
# 低电提醒：0=关；1–100=未插电且电量≤该值发一次系统通知
low_batt_warn=0
# 自动关机：0=关；1–15=未插电且电量≤该值倒计时后关机（须低于提醒）
low_batt_shutdown=0
# 关机倒计时秒数（低电：插电可取消；过温：降温可取消）
low_batt_shutdown_delay_sec=60
# 低电关机前最少开机秒数（默认 900≈15 分钟；0=不限制）
low_batt_shutdown_min_uptime_sec=900
# 过温关机：0=关；建议 55（插电也生效）
low_batt_temp_shutdown=0
