  <rect x="292" y="450" width="28" height="16" rx="8" fill="#d1d5db"/>
  <text x="48" y="492" font-family="system-ui,sans-serif" font-size="11" fill="#78716c">Bypass / slow / limit</text>
  <text x="48" y="512" font-family="system-ui,sans-serif" font-size="10" fill="#a8a29e">Expand to configure</text>
  <rect x="32" y="540" width="296" height="40" rx="10" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="48" y="564" font-family="system-ui,sans-serif" font-size="11" fill="#57534e">Full stop, plug reset, compat</text>
  <rect x="0" y="708" width="360" height="72" fill="#ffffff" stroke="#e8e0d4"/>
  <text x="45" y="752" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#a8a29e">Overview</text>
  <text x="135" y="752" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#d97706">Strategy</text>
  <text x="225" y="752" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#a8a29e">Log</text>
  <text x="315" y="752" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#a8a29e">More</text>
