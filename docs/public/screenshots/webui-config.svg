<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="360" height="780" viewBox="0 0 360 780" role="img" aria-label="WebUI Strategy">
  <rect width="360" height="780" rx="28" fill="#faf6f0"/>
  <rect x="16" y="52" width="328" height="640" rx="20" fill="#ffffff" stroke="#e8e0d4"/>
  <text x="180" y="88" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#1c1917">Strategy</text>
  <text x="32" y="118" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#44403c">Power stop</text>
  <text x="32" y="134" font-family="system-ui,sans-serif" font-size="10" fill="#78716c">Stop at threshold, resume when lower</text>
  <rect x="32" y="148" width="296" height="120" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="48" y="176" font-family="system-ui,sans-serif" font-size="11" fill="#78716c">Stop level</text>
  <text x="48" y="200" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#c2410c">80%</text>
  <rect x="48" y="212" width="40" height="20" rx="6" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="68" y="225" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#b45309">85</text>
  <rect x="96" y="212" width="40" height="20" rx="6" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="116" y="225" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#b45309">90</text>
  <text x="48" y="248" font-family="system-ui,sans-serif" font-size="11" fill="#78716c">Resume level</text>
  <text x="48" y="268" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#1c1917">75%</text>
  <text x="32" y="308" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#44403c">Temp guard</text>
  <rect x="32" y="322" width="296" height="72" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="48" y="352" font-family="system-ui,sans-serif" font-size="12" fill="#334155">Temp switch</text>
  <rect x="292" y="340" width="28" height="16" rx="8" fill="#d97706"/>
  <text x="48" y="376" font-family="system-ui,sans-serif" font-size="11" fill="#78716c">42C stop, 38C resume</text>
  <text x="32" y="420" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#44403c">Current control</text>
  <rect x="32" y="434" width="296" height="88" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
