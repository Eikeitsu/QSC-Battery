name: Build Web

on:
  push:
    branches: [main, master]
    paths:
      - "webui/**"
      - "module/webroot/**"
      - "tooling/scripts/build-web.mjs"
      - "tooling/scripts/publish-web-branch.mjs"
      - "package.json"
      - "package-lock.json"
      - "eslint.config.js"
      - ".prettierrc"
      - ".prettierignore"
      - ".github/actions/setup-node-npm/**"
      - ".github/workflows/build-web.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "webui/**"
      - "module/webroot/**"
      - "tooling/scripts/build-web.mjs"
      - "package.json"
      - "package-lock.json"
      - "eslint.config.js"
      - ".github/actions/setup-node-npm/**"
      - ".github/workflows/build-web.yml"
  workflow_dispatch:

jobs:
  build-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node-npm

      # lint / typecheck 由 Lint 工作流覆盖，此处只构建
      - run: npm run build:web

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: .build/webroot/
          if-no-files-found: error

  publish-web:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build-web
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: .build/webroot/

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Publish dist-web branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node tooling/scripts/publish-web-branch.mjs
