name: Release Module

on:
  workflow_dispatch:
    inputs:
      version:
        description: "日期（首发填 20260717；同日第2版填 20260717.2）"
        required: true
        type: string
      release_name:
        description: "Release 标题（可空，默认用 Tag）"
        required: false
        type: string
        default: ""
      prerelease:
        description: "标记为预发布"
        required: false
        type: boolean
        default: false
      draft:
        description: "保存为草稿（不正式发布）"
        required: false
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  actions: write
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      raw: ${{ steps.meta.outputs.raw }}
      version_code: ${{ steps.meta.outputs.version_code }}
      name: ${{ steps.meta.outputs.name }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      draft: ${{ steps.meta.outputs.draft }}
      zip: ${{ steps.meta.outputs.zip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ inputs.version }}"
            RAW="${RAW#v}"
            CUSTOM_NAME="${{ inputs.release_name }}"
            echo "prerelease=${{ inputs.prerelease }}" >> "$GITHUB_OUTPUT"
            echo "draft=${{ inputs.draft }}" >> "$GITHUB_OUTPUT"
          else
            TAG_NAME="${GITHUB_REF_NAME}"
            RAW="${TAG_NAME#v}"
            CUSTOM_NAME=""
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "draft=false" >> "$GITHUB_OUTPUT"
          fi

          eval "$(RAW="$RAW" python3 tooling/scripts/resolve-release-version.py)"
          TAG="v${version}"
          if [ -n "$CUSTOM_NAME" ]; then
            NAME="$CUSTOM_NAME"
          else
            NAME="$TAG"
          fi
          # update.json 指向主包（sh 版，无后缀；守护由 WebUI 按需下载）
          ZIP="QSC-Battery_v${version}.zip"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "raw=$version" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "Resolved release: $NAME ($TAG) versionCode=$version_code"

      - name: Sync module.prop version
        shell: bash
        run: |
          RAW="${{ steps.meta.outputs.raw }}"
          CODE="${{ steps.meta.outputs.version_code }}"
          PROP="module/module.prop"
          sed -i "s/^version=.*/version=${RAW}/" "$PROP"
          sed -i "s/^versionCode=.*/versionCode=${CODE}/" "$PROP"
          if ! grep -q '^updateJson=' "$PROP"; then
            echo "updateJson=https://eikeitsu.github.io/QSC-Battery/update.json" >> "$PROP"
          else
            sed -i "s|^updateJson=.*|updateJson=https://eikeitsu.github.io/QSC-Battery/update.json|" "$PROP"
          fi
          echo "---- module.prop ----"
          cat "$PROP"

      - uses: ./.github/actions/setup-node-npm

      # 守护二进制：两套实现都要有，四个变体包与 Pages 托管都依赖它们
      - uses: ./.github/actions/build-native

      - name: Build all module zips (full / rust / c / sh)
        run: npm run build:module:all

      # 与 Package Module 同一套断言：发版包也必须变体正确、zip 完好
      - name: Verify module zips
        run: npm run verify:zips

      - name: Verify hot update and release contracts
        run: npm run test:hot-update

      # 二进制随构件带到 post 任务：那里要把它们发到 Pages 供 WebUI 下载
      - name: Upload zips and native binaries
        uses: actions/upload-artifact@v4
        with:
          name: magisk-module-${{ steps.meta.outputs.tag }}
          path: |
            release/*.zip
            module/bin/qscd-arm64
            module/bin/qscd-arm
            module/bin/qscdc-arm64
            module/bin/qscdc-arm
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 解到仓库根：构件同时含 release/ 与 module/bin/，
      # 其内部路径是相对仓库根的（upload-artifact 取所有 path 的最近公共父目录做根）
      - uses: actions/download-artifact@v4
        with:
          name: magisk-module-${{ needs.build.outputs.tag }}
          path: .

      - name: Prepare release notes
        shell: bash
        run: |
          python3 tooling/scripts/prepare-release-notes.py \
            "${{ needs.build.outputs.raw }}" \
            changelog.md \
            .release-body.md
          echo "---- release body preview ----"
          cat .release-body.md || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: ${{ needs.build.outputs.name }}
          draft: ${{ needs.build.outputs.draft }}
          prerelease: ${{ needs.build.outputs.prerelease }}
          body_path: .release-body.md
          generate_release_notes: true
          files: release/*.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  post:
    needs: [build, publish]
    if: ${{ needs.build.outputs.draft != 'true' && needs.build.outputs.prerelease != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 回写主分支需要可推送
          token: ${{ secrets.GITHUB_TOKEN }}

      # 同 publish：解到仓库根，让 release/*.zip 与 module/bin/qscd-* 各回原位
      - uses: actions/download-artifact@v4
        with:
          name: magisk-module-${{ needs.build.outputs.tag }}
          path: .

      # 构件不保留权限位。四个都必须在：少一个就意味着 Pages 上缺守护，
      # WebUI 的下载入口会静默失效，所以这里硬失败而不是 `|| true`
      - name: Restore executable bit on native binaries
        shell: bash
        run: |
          set -euo pipefail
          for f in module/bin/qscd-arm64 module/bin/qscd-arm \
                   module/bin/qscdc-arm64 module/bin/qscdc-arm; do
            [ -f "$f" ] || { echo "missing $f (artifact layout changed?)"; exit 1; }
            chmod 0755 "$f"
          done

      - name: Update default branch (changelog / update.json / Pages zip + qscd)
        env:
          RAW: ${{ needs.build.outputs.raw }}
          CODE: ${{ needs.build.outputs.version_code }}
          TAG: ${{ needs.build.outputs.tag }}
          ZIP: ${{ needs.build.outputs.zip }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PAGES_BASE: https://eikeitsu.github.io/QSC-Battery
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tooling/scripts/post-release-update.sh
