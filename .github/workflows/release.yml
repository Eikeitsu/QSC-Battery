name: Release Module

on:
  workflow_dispatch:
    inputs:
      version:
        description: "日期（首发填 20260717；同日第2版填 20260717.2）"
        required: true
        type: string
      release_name:
        description: "Release 标题（可空，默认用 Tag）"
        required: false
        type: string
        default: ""
      # GitHub choice 无原生主/副标题：选项写成「主标题 — 副说明」
      publish_scope:
        description: "发布范围（主标题 — 保留原勾选项说明）"
        required: true
        type: choice
        default: "全部 — 模块 zip（5 变体 full/rust/c/sh/lite，update.json→full）+ Rust/C 守护 + 伴侣 APK"
        options:
          - "全部 — 模块 zip（5 变体 full/rust/c/sh/lite，update.json→full）+ Rust/C 守护 + 伴侣 APK"
          - "仅模块 — 发布模块 zip（5 变体：full / rust / c / sh / lite）→ update.json 指向 full"
          - "模块+APK — 模块 zip（5 变体）+ 伴侣 APK → app-update.json"
          - "仅守护 — Rust + C 守护二进制 → 驱动 qscd/manifest"
          - "仅 Rust 守护 — 发布 Rust 守护（qscd-rust-arm64 / qscd-rust-arm）→ 驱动 qscd/manifest"
          - "仅 C 守护 — 发布 C 守护（qscd-c-arm64 / qscd-c-arm）→ 驱动 qscd/manifest"
          - "仅 APK — 发布伴侣 APK → 驱动 app-update.json"
          - "模块+守护 — zip（5 变体）+ Rust/C 守护（不含 APK）"
      build_mode:
        description: "构建方式（主标题 — 说明）"
        required: true
        type: choice
        default: "重新构建 — 完整编译正式版（推荐，可复现、与发版 version 一致）"
        options:
          - "重新构建 — 完整编译正式版（推荐，可复现、与发版 version 一致）"
          - "晋升 CI — 取 ci-dist / Actions 成功产物，仅重盖正式 version 后打包（更快）"
      ci_promote_sha:
        description: "晋升 CI 时的 commit SHA（可空=用默认分支最新成功 CI 产物）；重新构建可忽略"
        required: false
        type: string
        default: ""
      prerelease:
        description: "标记为预发布"
        required: false
        type: boolean
        default: false
      draft:
        description: "保存为草稿（不正式发布）"
        required: false
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  actions: write
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      raw: ${{ steps.meta.outputs.raw }}
      version_code: ${{ steps.meta.outputs.version_code }}
      name: ${{ steps.meta.outputs.name }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      draft: ${{ steps.meta.outputs.draft }}
      zip: ${{ steps.meta.outputs.zip }}
      publish_zips: ${{ steps.meta.outputs.publish_zips }}
      publish_binaries_rust: ${{ steps.meta.outputs.publish_binaries_rust }}
      publish_binaries_c: ${{ steps.meta.outputs.publish_binaries_c }}
      publish_apk: ${{ steps.meta.outputs.publish_apk }}
      build_mode: ${{ steps.meta.outputs.build_mode }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve tag and publish scope
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ inputs.version }}"
            RAW="${RAW#v}"
            CUSTOM_NAME="${{ inputs.release_name }}"
            SCOPE="${{ inputs.publish_scope }}"
            MODE="${{ inputs.build_mode }}"
            echo "prerelease=${{ inputs.prerelease }}" >> "$GITHUB_OUTPUT"
            echo "draft=${{ inputs.draft }}" >> "$GITHUB_OUTPUT"

            # parse「主标题 — …」
            title="${SCOPE%% — *}"
            zips=false; rust=false; cbin=false; apk=false
            case "$title" in
              全部) zips=true; rust=true; cbin=true; apk=true ;;
              仅模块) zips=true ;;
              模块+APK) zips=true; apk=true ;;
              仅守护) rust=true; cbin=true ;;
              "仅 Rust 守护") rust=true ;;
              "仅 C 守护") cbin=true ;;
              仅 APK) apk=true ;;
              模块+守护) zips=true; rust=true; cbin=true ;;
              *)
                echo "未知 publish_scope: $SCOPE" >&2
                exit 1
                ;;
            esac
            echo "publish_zips=$zips" >> "$GITHUB_OUTPUT"
            echo "publish_binaries_rust=$rust" >> "$GITHUB_OUTPUT"
            echo "publish_binaries_c=$cbin" >> "$GITHUB_OUTPUT"
            echo "publish_apk=$apk" >> "$GITHUB_OUTPUT"

            if [[ "$MODE" == 晋升* ]]; then
              echo "build_mode=promote" >> "$GITHUB_OUTPUT"
            else
              echo "build_mode=rebuild" >> "$GITHUB_OUTPUT"
            fi

            ZIPS="$zips"
            RUST="$rust"
            CBIN="$cbin"
            APK="$apk"
          else
            TAG_NAME="${GITHUB_REF_NAME}"
            RAW="${TAG_NAME#v}"
            CUSTOM_NAME=""
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "draft=false" >> "$GITHUB_OUTPUT"
            echo "publish_zips=true" >> "$GITHUB_OUTPUT"
            echo "publish_binaries_rust=true" >> "$GITHUB_OUTPUT"
            echo "publish_binaries_c=true" >> "$GITHUB_OUTPUT"
            echo "publish_apk=true" >> "$GITHUB_OUTPUT"
            echo "build_mode=rebuild" >> "$GITHUB_OUTPUT"
            ZIPS=true
            RUST=true
            CBIN=true
            APK=true
          fi

          if [ "$ZIPS" != "true" ] && [ "$RUST" != "true" ] && \
             [ "$CBIN" != "true" ] && [ "$APK" != "true" ]; then
            echo "发布范围无效：至少需要 zip / Rust / C / APK 之一" >&2
            exit 1
          fi

          eval "$(RAW="$RAW" QSC_FETCH_REMOTE_CODES=1 python3 tooling/scripts/resolve-release-version.py)"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.prerelease }}" = "true" ]; then
            case "$version" in
              *.pre) ;;
              *) version="${version}.pre" ;;
            esac
          fi
          TAG="v${version}"
          if [ -n "$CUSTOM_NAME" ]; then
            NAME="$CUSTOM_NAME"
          else
            NAME="$TAG"
          fi
          ZIP="QSC-Battery_v${version}-full.zip"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "raw=$version" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "Resolved release: $NAME ($TAG) versionCode=$version_code scope zips=$ZIPS rust=$RUST c=$CBIN apk=$APK"

      - name: Sync module.prop version
        shell: bash
        run: |
          RAW="${{ steps.meta.outputs.raw }}"
          CODE="${{ steps.meta.outputs.version_code }}"
          PROP="module/module.prop"
          sed -i "s/^version=.*/version=${RAW}/" "$PROP"
          sed -i "s/^versionCode=.*/versionCode=${CODE}/" "$PROP"
          if ! grep -q '^updateJson=' "$PROP"; then
            echo "updateJson=https://eikeitsu.github.io/QSC-Battery/update.json" >> "$PROP"
          else
            sed -i "s|^updateJson=.*|updateJson=https://eikeitsu.github.io/QSC-Battery/update.json|" "$PROP"
          fi
          echo "---- module.prop ----"
          cat "$PROP"

      - uses: ./.github/actions/setup-node-npm

      # ----- 晋升 CI：取产物后按正式 version 重打包 -----
      - name: Promote from CI artifacts
        id: promote
        if: steps.meta.outputs.build_mode == 'promote'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PROMOTE_SHA: ${{ inputs.ci_promote_sha }}
        run: |
          set -euo pipefail
          SHA="$PROMOTE_SHA"
          if [ -z "$SHA" ]; then
            SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${{ github.event.repository.default_branch }}" -q .sha)"
          fi
          echo "promote_sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Promoting CI artifacts @ $SHA"
          export EXPECTED_SHA="$SHA"
          export BEFORE_SHA=""
          export QSC_FETCH_APP=1 QSC_FETCH_QSCD=1 QSC_FETCH_WEB=1
          export QSC_DEP_WAIT_SECONDS=60
          # promote 允许 tip（不强制同 SHA），但优先同 SHA
          chmod +x tooling/scripts/resolve-packaging-deps.sh
          # 临时放宽：若 tip 存在即用（NEED_* 由 diff 决定；无 before 时会 require all）
          # 对发版晋升：强制用 tip + 可选同 SHA artifact
          OWNER_REPO="$GITHUB_REPOSITORY"
          CI="https://raw.githubusercontent.com/${OWNER_REPO}/ci-dist"
          mkdir -p release module/bin .build/webroot
          curl -fsSL -o release/QSC-Battery.apk "${CI}/app/QSC-Battery.apk" \
            || curl -fsSL -o release/QSC-Battery.apk "${CI}/QSC-Battery.apk"
          curl -fsSL -o module/bin/qscd-arm64 "${CI}/qscd/qscd-rust-arm64"
          curl -fsSL -o module/bin/qscd-arm "${CI}/qscd/qscd-rust-arm"
          curl -fsSL -o module/bin/qscdc-arm64 "${CI}/qscd/qscd-c-arm64"
          curl -fsSL -o module/bin/qscdc-arm "${CI}/qscd/qscd-c-arm"
          chmod 0755 module/bin/qscd-arm64 module/bin/qscd-arm module/bin/qscdc-arm64 module/bin/qscdc-arm
          WEB_TMP="$(mktemp -d)"
          git clone --depth 1 --branch dist-web \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${OWNER_REPO}.git" "$WEB_TMP"
          cp -a "$WEB_TMP"/. .build/webroot/
          rm -rf .build/webroot/.git "$WEB_TMP"
          rm -rf module/webroot
          cp -a .build/webroot module/webroot
          export QSC_SKIP_BUILD_WEB=1 QSC_SKIP_BUILD_NATIVE=1 REQUIRE_COMPANION_APK=1
          npm run build:module:all
          npm run verify:zips

      - uses: ./.github/actions/setup-android
        if: steps.meta.outputs.build_mode != 'promote' && steps.meta.outputs.publish_apk == 'true'

      # ----- 重新构建（默认）-----
      - uses: ./.github/actions/build-native
        if: steps.meta.outputs.build_mode != 'promote'

      - name: Build companion release APK
        if: steps.meta.outputs.build_mode != 'promote'
        working-directory: app
        env:
          RAW: ${{ steps.meta.outputs.raw }}
          CODE: ${{ steps.meta.outputs.version_code }}
          IS_PRE: ${{ steps.meta.outputs.prerelease }}
          WANT_APK: ${{ steps.meta.outputs.publish_apk }}
        run: |
          if [ "$WANT_APK" != "true" ] && [ "${{ steps.meta.outputs.publish_zips }}" != "true" ]; then
            echo "skip APK (not in publish scope for zip embedding)"
            mkdir -p ../release
            exit 0
          fi
          if [ "$IS_PRE" = "true" ] || [[ "$RAW" == *.pre ]]; then
            ./gradlew :app:assembleRelease --stacktrace \
              -PqscVersionName="$RAW" \
              -PqscVersionCode="$CODE"
          else
            ./gradlew :app:assembleRelease --stacktrace
          fi
          mkdir -p ../release
          cp app/build/outputs/apk/release/app-release.apk ../release/QSC-Battery.apk

      - name: Build all module zips (full / rust / c / sh / lite)
        if: steps.meta.outputs.build_mode != 'promote'
        env:
          REQUIRE_COMPANION_APK: ${{ steps.meta.outputs.publish_apk == 'true' && '1' || '0' }}
        run: |
          if [ "${{ steps.meta.outputs.publish_zips }}" != "true" ] && \
             [ "${{ steps.meta.outputs.publish_binaries_rust }}" != "true" ] && \
             [ "${{ steps.meta.outputs.publish_binaries_c }}" != "true" ]; then
            echo "skip module zip build (scope is APK-only)"
            exit 0
          fi
          npm run build:module:all

      - name: Verify module zips
        if: steps.meta.outputs.build_mode != 'promote' && steps.meta.outputs.publish_zips == 'true'
        run: npm run verify:zips

      - name: Verify hot update and release contracts
        if: steps.meta.outputs.build_mode != 'promote'
        run: npm run test:hot-update

      # 二进制 / APK 随构件带到 publish / post
      - name: Upload zips, native binaries, and APK
        uses: actions/upload-artifact@v6
        with:
          name: magisk-module-${{ steps.meta.outputs.tag }}
          path: |
            release/*.zip
            release/QSC-Battery.apk
            module/bin/qscd-arm64
            module/bin/qscd-arm
            module/bin/qscdc-arm64
            module/bin/qscdc-arm
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # 解到仓库根：构件同时含 release/ 与 module/bin/
      - uses: actions/download-artifact@v6
        with:
          name: magisk-module-${{ needs.build.outputs.tag }}
          path: .

      - name: Prepare release notes
        shell: bash
        run: |
          python3 tooling/scripts/prepare-release-notes.py \
            "${{ needs.build.outputs.raw }}" \
            changelog.md \
            .release-body.md
          {
            echo ""
            echo "<!-- qsc:versionCode=${{ needs.build.outputs.version_code }} -->"
            echo "versionCode=${{ needs.build.outputs.version_code }}"
          } >> .release-body.md
          echo "---- release body preview ----"
          cat .release-body.md || true

      - name: Stage selected release assets
        id: assets
        shell: bash
        env:
          RAW: ${{ needs.build.outputs.raw }}
          PUBLISH_ZIPS: ${{ needs.build.outputs.publish_zips }}
          PUBLISH_RUST: ${{ needs.build.outputs.publish_binaries_rust }}
          PUBLISH_C: ${{ needs.build.outputs.publish_binaries_c }}
          PUBLISH_APK: ${{ needs.build.outputs.publish_apk }}
        run: |
          set -euo pipefail
          mkdir -p .release-assets
          count=0

          if [ "$PUBLISH_ZIPS" = "true" ]; then
            shopt -s nullglob
            zips=(release/*.zip)
            if [ ${#zips[@]} -eq 0 ]; then
              echo "勾选了 zip，但 release/*.zip 为空" >&2
              exit 1
            fi
            cp "${zips[@]}" .release-assets/
            count=$((count + ${#zips[@]}))
            echo "staged zips: ${zips[*]}"
          fi

          stage_bin() {
            local src="$1" dst="$2"
            [ -f "$src" ] || { echo "missing $src" >&2; exit 1; }
            cp "$src" ".release-assets/$dst"
            chmod 0755 ".release-assets/$dst"
            count=$((count + 1))
            echo "staged binary: $dst"
          }

          if [ "$PUBLISH_RUST" = "true" ]; then
            stage_bin module/bin/qscd-arm64 qscd-rust-arm64
            stage_bin module/bin/qscd-arm qscd-rust-arm
          fi

          if [ "$PUBLISH_C" = "true" ]; then
            stage_bin module/bin/qscdc-arm64 qscd-c-arm64
            stage_bin module/bin/qscdc-arm qscd-c-arm
          fi

          if [ "$PUBLISH_APK" = "true" ]; then
            [ -f release/QSC-Battery.apk ] || {
              echo "勾选了 APK，但缺少 release/QSC-Battery.apk" >&2
              exit 1
            }
            apk_name="QSC-Battery_v${RAW}.apk"
            cp release/QSC-Battery.apk ".release-assets/${apk_name}"
            count=$((count + 1))
            echo "staged apk: ${apk_name}"
          fi

          if [ "$count" -eq 0 ]; then
            echo "没有可上传的 Release 资产" >&2
            exit 1
          fi
          echo "---- release assets ($count) ----"
          ls -la .release-assets
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: ${{ needs.build.outputs.name }}
          draft: ${{ needs.build.outputs.draft }}
          prerelease: ${{ needs.build.outputs.prerelease }}
          body_path: .release-body.md
          generate_release_notes: true
          files: .release-assets/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 预发布不写 Pages；写 updates/prerelease 供 APP/WebUI（避免 api.github.com 403）
      - name: Publish updates/prerelease
        if: ${{ needs.build.outputs.prerelease == 'true' && needs.build.outputs.draft != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RAW: ${{ needs.build.outputs.raw }}
          CODE: ${{ needs.build.outputs.version_code }}
          TAG: ${{ needs.build.outputs.tag }}
          PUBLISH_ZIPS: ${{ needs.build.outputs.publish_zips }}
          PUBLISH_APK: ${{ needs.build.outputs.publish_apk }}
          PUBLISH_RUST: ${{ needs.build.outputs.publish_binaries_rust }}
          PUBLISH_C: ${{ needs.build.outputs.publish_binaries_c }}
        run: |
          set -euo pipefail
          chmod +x tooling/scripts/publish-updates.sh
          REL="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          ARGS=(prerelease --source-sha "${{ github.sha }}")
          if [ "$PUBLISH_ZIPS" = "true" ]; then
            ARGS+=(
              --module-version "$RAW"
              --module-code "$CODE"
              --module-zip-url "${REL}/QSC-Battery_v${RAW}-full.zip"
              --module-changelog "https://github.com/${{ github.repository }}/releases/tag/${TAG}"
            )
          fi
          if [ "$PUBLISH_APK" = "true" ]; then
            ARGS+=(
              --app-version "$RAW"
              --app-code "$CODE"
              --app-apk-url "${REL}/QSC-Battery_v${RAW}.apk"
              --app-changelog "https://github.com/${{ github.repository }}/releases/tag/${TAG}"
            )
          fi
          if [ "$PUBLISH_RUST" = "true" ] || [ "$PUBLISH_C" = "true" ]; then
            DDIR="$(mktemp -d)"
            [ -f module/bin/qscd-arm64 ] && cp module/bin/qscd-arm64 "$DDIR/qscd-rust-arm64"
            [ -f module/bin/qscd-arm ] && cp module/bin/qscd-arm "$DDIR/qscd-rust-arm"
            [ -f module/bin/qscdc-arm64 ] && cp module/bin/qscdc-arm64 "$DDIR/qscd-c-arm64"
            [ -f module/bin/qscdc-arm ] && cp module/bin/qscdc-arm "$DDIR/qscd-c-arm"
            # Release asset names match qscd-rust-* / qscd-c-*
            ARGS+=(
              --daemon-version "$RAW"
              --daemon-code "$CODE"
              --daemon-base-url "$REL"
              --daemon-dir "$DDIR"
              --daemon-rust-built "$([ "$PUBLISH_RUST" = "true" ] && echo 1 || echo 0)"
              --daemon-c-built "$([ "$PUBLISH_C" = "true" ] && echo 1 || echo 0)"
            )
          fi
          tooling/scripts/publish-updates.sh "${ARGS[@]}"
          rm -rf "${DDIR:-}"

  post:
    needs: [build, publish]
    if: ${{ needs.build.outputs.draft != 'true' && needs.build.outputs.prerelease != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # 回写主分支需要可推送
          token: ${{ secrets.GITHUB_TOKEN }}

      # 同 publish：解到仓库根，让 release/*.zip 与 module/bin/qscd-* 各回原位
      - uses: actions/download-artifact@v6
        with:
          name: magisk-module-${{ needs.build.outputs.tag }}
          path: .

      # 构件不保留权限位。四个都必须在：少一个就意味着 Pages 上缺守护，
      # WebUI 的下载入口会静默失效，所以这里硬失败而不是 `|| true`
      - name: Restore executable bit on native binaries
        shell: bash
        run: |
          set -euo pipefail
          for f in module/bin/qscd-arm64 module/bin/qscd-arm \
                   module/bin/qscdc-arm64 module/bin/qscdc-arm; do
            [ -f "$f" ] || { echo "missing $f (artifact layout changed?)"; exit 1; }
            chmod 0755 "$f"
          done

      - name: Update default branch (changelog / update.json / Pages zip + qscd + apk)
        env:
          RAW: ${{ needs.build.outputs.raw }}
          CODE: ${{ needs.build.outputs.version_code }}
          TAG: ${{ needs.build.outputs.tag }}
          ZIP: ${{ needs.build.outputs.zip }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PAGES_BASE: https://eikeitsu.github.io/QSC-Battery
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_ZIPS: ${{ needs.build.outputs.publish_zips }}
          PUBLISH_BINS_RUST: ${{ needs.build.outputs.publish_binaries_rust }}
          PUBLISH_BINS_C: ${{ needs.build.outputs.publish_binaries_c }}
          PUBLISH_APK: ${{ needs.build.outputs.publish_apk }}
        run: bash tooling/scripts/post-release-update.sh

      - name: Sync updates/stable metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RAW: ${{ needs.build.outputs.raw }}
          CODE: ${{ needs.build.outputs.version_code }}
          PAGES_BASE: https://eikeitsu.github.io/QSC-Battery
          PUBLISH_ZIPS: ${{ needs.build.outputs.publish_zips }}
          PUBLISH_APK: ${{ needs.build.outputs.publish_apk }}
          PUBLISH_RUST: ${{ needs.build.outputs.publish_binaries_rust }}
          PUBLISH_C: ${{ needs.build.outputs.publish_binaries_c }}
        run: |
          set -euo pipefail
          chmod +x tooling/scripts/publish-updates.sh
          ARGS=(stable --source-sha "${{ github.sha }}")
          if [ "$PUBLISH_ZIPS" = "true" ]; then
            ARGS+=(
              --module-version "$RAW"
              --module-code "$CODE"
              --module-zip-url "${PAGES_BASE}/releases/QSC-Battery_v${RAW}-full.zip"
              --module-changelog "${PAGES_BASE}/changelog.md"
            )
          fi
          if [ "$PUBLISH_APK" = "true" ]; then
            # Prefer Pages app-update.json fields if present
            APP_VER="$RAW"
            APP_CODE="$CODE"
            if [ -f docs/public/app-update.json ]; then
              APP_VER="$(python3 -c 'import json;print(json.load(open("docs/public/app-update.json"))["version"])')"
              APP_CODE="$(python3 -c 'import json;print(json.load(open("docs/public/app-update.json"))["versionCode"])')"
            fi
            ARGS+=(
              --app-version "$APP_VER"
              --app-code "$APP_CODE"
              --app-apk-url "${PAGES_BASE}/releases/QSC-Battery_v${RAW}.apk"
              --app-changelog "${PAGES_BASE}/changelog.md"
            )
          fi
          if [ "$PUBLISH_RUST" = "true" ] || [ "$PUBLISH_C" = "true" ]; then
            DDIR="$(mktemp -d)"
            [ -f docs/public/qscd/qscd-rust-arm64 ] && cp docs/public/qscd/qscd-rust-arm64 "$DDIR/"
            [ -f docs/public/qscd/qscd-rust-arm ] && cp docs/public/qscd/qscd-rust-arm "$DDIR/"
            [ -f docs/public/qscd/qscd-c-arm64 ] && cp docs/public/qscd/qscd-c-arm64 "$DDIR/"
            [ -f docs/public/qscd/qscd-c-arm ] && cp docs/public/qscd/qscd-c-arm "$DDIR/"
            ARGS+=(
              --daemon-version "$RAW"
              --daemon-code "$CODE"
              --daemon-base-url "${PAGES_BASE}/qscd"
              --daemon-dir "$DDIR"
              --daemon-rust-built "$([ "$PUBLISH_RUST" = "true" ] && echo 1 || echo 0)"
              --daemon-c-built "$([ "$PUBLISH_C" = "true" ] && echo 1 || echo 0)"
            )
          fi
          tooling/scripts/publish-updates.sh "${ARGS[@]}"
          rm -rf "${DDIR:-}"
