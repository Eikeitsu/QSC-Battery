name: App

# 伴侣 APP：仅 app 相关路径变更时构建；自行推送 ci-dist/app 与 updates/ci/app-update.json。

on:
  push:
    branches: [main, master]
    paths:
      - "apps/android/**"
      - "tooling/scripts/package-app.mjs"
      - "tooling/scripts/publish-ci-dist.sh"
      - "tooling/scripts/publish-ci-product.sh"
      - "tooling/scripts/publish-updates.sh"
      - "tooling/scripts/git-push-tree.sh"
      - ".github/workflows/app.yml"
      - ".github/workflows/reusable-ci-version.yml"
      - ".github/actions/setup-android/**"
  pull_request:
    paths:
      - "apps/android/**"
      - "tooling/scripts/package-app.mjs"
      - ".github/workflows/app.yml"
      - ".github/actions/setup-android/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  allocate:
    uses: ./.github/workflows/reusable-ci-version.yml
    with:
      product: app

  assemble:
    needs: allocate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-android

      - uses: ./.github/actions/setup-node-npm

      - name: Spotless check (ktlint)
        working-directory: apps/android
        run: ./gradlew spotlessCheck --stacktrace

      - name: Assemble release + debug
        working-directory: apps/android
        run: |
          ./gradlew assembleRelease assembleDebug --stacktrace \
            -PqscVersionName="${{ needs.allocate.outputs.version }}" \
            -PqscVersionCode="${{ needs.allocate.outputs.code }}"

      - name: Stage APKs
        run: |
          mkdir -p release
          cp apps/android/build/outputs/apk/release/app-release.apk release/QSC-Battery.apk
          cp apps/android/build/outputs/apk/debug/app-debug.apk release/QSC-Battery-debug.apk
          node tooling/scripts/package-app.mjs --skip-build

      - uses: actions/upload-artifact@v6
        with:
          name: qsc-companion-apk
          path: |
            release/QSC-Battery.apk
            release/QSC-Battery-debug.apk
            docs/public/app-update.json
            app-update.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish ci-dist/app + updates/ci
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_VERSION: ${{ needs.allocate.outputs.version }}
          APP_CODE: ${{ needs.allocate.outputs.code }}
        run: |
          chmod +x tooling/scripts/publish-ci-product.sh
          tooling/scripts/publish-ci-product.sh app
