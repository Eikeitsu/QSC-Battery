name: Lint

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # PR commitlint 需要完整历史；push 浅克隆即可
          fetch-depth: ${{ github.event_name == 'pull_request' && 0 || 1 }}

      - uses: ./.github/actions/setup-node-npm

      - name: Install shellcheck / busybox
        run: sudo apt-get update && sudo apt-get install -y shellcheck busybox

      - name: ESLint / Stylelint / Markdown / Shell
        run: npm run lint
        env:
          REQUIRE_SHELLCHECK: "1"

      # 停充判定的行为用例：假 sysfs + 假开关节点跑真 qsc_switch.sh
      - name: Charge decision tests (busybox ash)
        run: npm run test:shell
        env:
          REQUIRE_SHELL_TESTS: "1"

      - name: Service recovery tests (busybox ash)
        run: npm run test:service-recovery
        env:
          REQUIRE_SERVICE_TESTS: "1"

      - name: Hot update and release contracts
        run: npm run test:hot-update

      - name: Typecheck WebUI
        run: npm run typecheck:web

      - name: Prettier check
        run: npm run format:check

      # 原生等待器：宿主端跑 fmt / clippy / 单测（不需要 NDK）
      - name: Setup Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - name: Rust fmt / clippy / test (qscd)
        working-directory: native/qscd
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      # C 版等待器：宿主 clang 编译 + 跑内建 selftest（不需要 NDK）
      - name: C build / selftest (qscd-c)
        working-directory: native/qscd-c
        run: |
          clang -std=gnu11 -Os -Wall -Wextra -Werror -o /tmp/qscd-host qscd.c
          /tmp/qscd-host selftest

      - name: Commitlint (PR range)
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
