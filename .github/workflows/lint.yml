name: Lint

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (lint / typecheck / unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # PR commitlint 需要完整历史；push 浅克隆即可
          fetch-depth: ${{ github.event_name == 'pull_request' && 0 || 1 }}

      - uses: ./.github/actions/setup-node-npm

      - name: ESLint / Stylelint / Markdown
        run: npm run lint:js && npm run lint:style && npm run lint:md

      - name: Typecheck WebUI
        run: npm run typecheck:web

      - name: Unit tests (Vitest)
        run: npm run test:unit

      - name: Prettier check
        run: npm run format:check

      - name: Commitlint (PR range)
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  shell:
    name: Shell (lint / ash tests / contracts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-node-npm

      # runner 自带 busybox-static（/bin/busybox）；勿再装 busybox 包以免替换它
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck

      - name: ShellCheck
        run: npm run lint:shell
        env:
          REQUIRE_SHELLCHECK: "1"

      - name: Charge decision tests (busybox ash)
        run: npm run test:shell
        env:
          REQUIRE_SHELL_TESTS: "1"

      - name: Service recovery tests (busybox ash)
        run: npm run test:service-recovery
        env:
          REQUIRE_SERVICE_TESTS: "1"

      - name: Hot update and release contracts
        run: npm run test:hot-update && npm run test:stamp-ci && npm run test:version-code && npm run test:release-version && node tooling/scripts/check-frozen-contracts.mjs

  rust:
    name: Rust (fmt / clippy / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - name: Rust fmt / clippy / test (qscd)
        working-directory: native/qscd-rust
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

  kotlin:
    name: Kotlin (Spotless / ktlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-android

      - name: Spotless check (ktlint)
        working-directory: apps/android
        run: ./gradlew spotlessCheck --stacktrace

  c:
    name: C (host selftest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: C build / selftest (qscd-c)
        working-directory: native/qscd-c
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang
          clang -std=gnu11 -Os -Wall -Wextra -Werror -o /tmp/qscd-host qscd.c
          /tmp/qscd-host selftest

  lint:
    name: Lint gate
    runs-on: ubuntu-latest
    needs: [web, shell, rust, kotlin, c]
    if: always()
    steps:
      - name: Require all jobs success
        run: |
          echo "web=${{ needs.web.result }}"
          echo "shell=${{ needs.shell.result }}"
          echo "rust=${{ needs.rust.result }}"
          echo "kotlin=${{ needs.kotlin.result }}"
          echo "c=${{ needs.c.result }}"
          test "${{ needs.web.result }}" = "success"
          test "${{ needs.shell.result }}" = "success"
          test "${{ needs.rust.result }}" = "success"
          test "${{ needs.kotlin.result }}" = "success"
          test "${{ needs.c.result }}" = "success"
