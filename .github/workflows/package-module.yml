name: Package Module

# 说明：曾出现仅改 module/bin/... 时 paths: module/** 未触发的情况。
# 主分支改为 paths-ignore（只跳过纯文档），避免漏打 zip。

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".gitignore"
      - "LICENSE"
      - ".husky/**"
  pull_request:
    branches: [main, master]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".gitignore"
      - "LICENSE"
      - ".husky/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-module-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node-npm

      - uses: ./.github/actions/build-native

      - name: Build all module zips (full / rust / c / sh)
        run: npm run build:module:all

      # 变体断言 + zip 完整性校验，并写一份 Step Summary
      - name: Verify module zips
        run: npm run verify:zips

      # 热更新契约由 Lint 工作流的 shell job 覆盖，此处不再重复跑

      - uses: actions/upload-artifact@v4
        with:
          name: magisk-module-${{ github.sha }}
          path: release/*.zip
          if-no-files-found: error
          retention-days: 14
