name: Package Module

on:
  push:
    branches: [main, master]
    paths:
      - "module/**"
      - "tooling/scripts/build-web.mjs"
      - "tooling/scripts/package-module.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/actions/setup-node-npm/**"
      - ".github/workflows/package-module.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "module/**"
      - "tooling/scripts/build-web.mjs"
      - "tooling/scripts/package-module.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/actions/setup-node-npm/**"
      - ".github/workflows/package-module.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node-npm

      - run: npm run build:module

      - uses: actions/upload-artifact@v4
        with:
          name: magisk-module
          path: release/*.zip
          if-no-files-found: error
