name: Package Module

# 说明：曾出现仅改 module/bin/... 时 paths: module/** 未触发的情况。
# 主分支改为 paths-ignore（只跳过纯文档），避免漏打 zip。

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".gitignore"
      - "LICENSE"
      - ".husky/**"
  pull_request:
    branches: [main, master]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".gitignore"
      - "LICENSE"
      - ".husky/**"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: package-module-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-node-npm

      - uses: ./.github/actions/build-native

      - uses: ./.github/actions/setup-android

      # 先 stamp：模块 version=….ci.N；再编 APK，使 versionName 与检测用 versionCode 一致
      - name: Stamp CI module.prop version
        id: stamp
        run: |
          eval "$(python3 tooling/scripts/stamp-ci-module-version.py --fetch-remote)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "CI stamp: $version (versionCode=$version_code)"
          echo "---- module.prop ----"
          cat module/module.prop

      - name: Build companion release APK
        working-directory: app
        run: |
          ./gradlew :app:assembleRelease --stacktrace \
            -PqscVersionName="${{ steps.stamp.outputs.version }}" \
            -PqscVersionCode="${{ steps.stamp.outputs.version_code }}"
          mkdir -p ../release
          cp app/build/outputs/apk/release/app-release.apk ../release/QSC-Battery.apk

      - name: Build all module zips (full / rust / c / sh / lite)
        env:
          REQUIRE_COMPANION_APK: "1"
        run: npm run build:module:all

      - name: Verify module zips
        run: npm run verify:zips

      - uses: actions/upload-artifact@v6
        with:
          name: magisk-module-${{ steps.stamp.outputs.version }}-${{ github.sha }}
          path: |
            release/*.zip
            release/QSC-Battery.apk
          if-no-files-found: error
          retention-days: 14

      # 默认分支 CI 推送到 ci-dist（公开 JSON+包，无 Token）；PR 不推
      - name: Publish ci-dist branch
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x tooling/scripts/publish-ci-dist.sh
          tooling/scripts/publish-ci-dist.sh \
            "${{ steps.stamp.outputs.version }}" \
            "${{ steps.stamp.outputs.version_code }}"
