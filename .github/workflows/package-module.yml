name: Package Module

# 只打模块 zip。依赖经 resolve-packaging-deps（同 commit 溯源）。
# Build Web / Build qscd / App 成功后可串联重打包。
# push 且同提交还改了依赖产品时：整 job skip（勿 cancel），避免提交总状态变红叉。

on:
  push:
    branches: [main, master]
    paths:
      - "module/**"
      - "tooling/scripts/package-module.mjs"
      - "tooling/scripts/verify-module-zips.mjs"
      - "tooling/scripts/write-unix-zip.mjs"
      - "tooling/scripts/lib/**"
      - "tooling/scripts/stamp-ci-module-version.py"
      - "tooling/scripts/resolve-packaging-deps.sh"
      - "tooling/scripts/plan-packaging-deps.sh"
      - "tooling/scripts/module-input-digest.sh"
      - "tooling/scripts/publish-ci-dist.sh"
      - "tooling/scripts/publish-ci-product.sh"
      - "tooling/scripts/publish-updates.sh"
      - "tooling/scripts/git-push-tree.sh"
      - "tooling/scripts/build-native-cli.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/package-module.yml"
      - ".github/workflows/reusable-ci-version.yml"
      - ".github/actions/setup-node-npm/**"
  pull_request:
    branches: [main, master]
    paths:
      - "module/**"
      - "tooling/scripts/package-module.mjs"
      - "tooling/scripts/verify-module-zips.mjs"
      - "tooling/scripts/write-unix-zip.mjs"
      - "tooling/scripts/lib/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/package-module.yml"
  workflow_run:
    workflows: ["Build Web", "Build qscd", "App"]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: package-module-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  plan:
    if: >
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      run_package: ${{ steps.gate.outputs.run_package }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Decide whether to package now
        id: gate
        env:
          EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          BEFORE_SHA: ${{ github.event_name == 'push' && github.event.before || '' }}
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          chmod +x tooling/scripts/plan-packaging-deps.sh
          eval "$(tooling/scripts/plan-packaging-deps.sh)"
          echo "plan: app=$need_app qscd=$need_qscd web=$need_web ready=$siblings_ready → run=$run_package"
          echo "run_package=$run_package" >> "$GITHUB_OUTPUT"
          if [ "$run_package" != "1" ]; then
            if [ "$EVENT_NAME" = "push" ]; then
              echo "skip push packaging：同提交改了依赖产品，等 App/qscd/Web 全部成功后再打"
            else
              echo "skip workflow_run packaging：仍有依赖未就绪（app=$need_app/$siblings_ready），等最后一个兄弟成功再打"
            fi
          fi

  package-module:
    needs: plan
    if: needs.plan.outputs.run_package == '1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - uses: ./.github/actions/setup-node-npm

      - name: Resolve APP / qscd / webroot deps
        id: deps
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          BEFORE_SHA: ${{ github.event_name == 'push' && github.event.before || '' }}
          WEB_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Build Web' && github.event.workflow_run.id || '' }}
          QSCD_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Build qscd' && github.event.workflow_run.id || '' }}
          APP_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.name == 'App' && github.event.workflow_run.id || '' }}
          QSC_DEP_WAIT_SECONDS: "600"
        run: |
          chmod +x tooling/scripts/resolve-packaging-deps.sh tooling/scripts/module-input-digest.sh
          tooling/scripts/resolve-packaging-deps.sh
          DIGEST="$(tooling/scripts/module-input-digest.sh | tail -1)"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "input digest=$DIGEST"
          tip="$(curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/ci-dist/module/INPUT_DIGEST" 2>/dev/null || true)"
          if [ -n "$tip" ] && [ "$tip" = "$DIGEST" ]; then
            echo "unchanged=1" >> "$GITHUB_OUTPUT"
            echo "module inputs unchanged vs ci-dist tip — skip rebuild/publish"
          else
            echo "unchanged=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Allocate module versionCode
        id: ver
        if: steps.deps.outputs.unchanged != '1'
        run: |
          eval "$(python3 tooling/scripts/next-version-code.py --fetch-remote)"
          run="${GITHUB_RUN_NUMBER:-0}"
          today="$(date -u +%Y.%m.%d)"
          echo "module_code=${version_code}" >> "$GITHUB_OUTPUT"
          echo "module_version=${today}.ci.${run}" >> "$GITHUB_OUTPUT"

      - name: Stamp CI module.prop
        if: steps.deps.outputs.unchanged != '1'
        run: |
          python3 tooling/scripts/stamp-ci-module-version.py --fetch-remote \
            --code "${{ steps.ver.outputs.module_code }}" \
            --version "${{ steps.ver.outputs.module_version }}"
          cat module/module.prop

      - uses: ./.github/actions/setup-ndk-clang
        if: steps.deps.outputs.unchanged != '1'
        id: ndk

      - name: Build native qsc CLI (lightweight)
        if: steps.deps.outputs.unchanged != '1'
        env:
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
          REQUIRE_NATIVE: "0"
        run: |
          node tooling/scripts/build-native-cli.mjs || echo "warn: qsc cli build skipped"

      - name: Cache module zip workspace
        if: steps.deps.outputs.unchanged != '1'
        uses: actions/cache@v4
        with:
          path: |
            .build/staging
            node_modules
          key: pkg-mod-${{ runner.os }}-${{ hashFiles('package-lock.json', 'tooling/scripts/package-module.mjs', 'tooling/scripts/lib/**') }}-${{ steps.deps.outputs.digest }}
          restore-keys: |
            pkg-mod-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build all module zips
        if: steps.deps.outputs.unchanged != '1'
        env:
          QSC_SKIP_BUILD_WEB: "1"
          QSC_SKIP_BUILD_NATIVE: "1"
          REQUIRE_COMPANION_APK: "0"
        run: npm run build:module:all

      - name: Verify module zips
        if: steps.deps.outputs.unchanged != '1'
        run: npm run verify:zips

      - uses: actions/upload-artifact@v6
        if: steps.deps.outputs.unchanged != '1'
        with:
          name: magisk-module-ci-${{ github.sha }}
          path: |
            release/*.zip
            release/QSC-Battery.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Publish ci-dist/module + updates/ci
        if: >
          steps.deps.outputs.unchanged != '1' &&
          ((github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
           (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
           (github.event_name == 'workflow_run' &&
            (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'master')))
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODULE_VERSION: ${{ steps.ver.outputs.module_version }}
          MODULE_CODE: ${{ steps.ver.outputs.module_code }}
          INPUT_DIGEST: ${{ steps.deps.outputs.digest }}
        run: |
          chmod +x tooling/scripts/publish-ci-product.sh
          tooling/scripts/publish-ci-product.sh module
