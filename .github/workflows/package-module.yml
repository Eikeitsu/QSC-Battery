name: Package Module

# 说明：曾出现仅改 module/bin/... 时 paths: module/** 未触发的情况。
# 主分支改为 paths-ignore（只跳过纯文档），避免漏打 zip。

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".gitignore"
      - "LICENSE"
      - ".husky/**"
  pull_request:
    branches: [main, master]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".gitignore"
      - "LICENSE"
      - ".husky/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-module-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node-npm

      - name: Build module zip
        run: npm run build:module

      - name: Summarize package
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t zips < <(ls -1 release/*.zip)
          {
            echo "## Module package"
            echo "- commit: \`${GITHUB_SHA}\`"
            echo "- ref: \`${GITHUB_REF_NAME}\`"
            echo
            for z in "${zips[@]}"; do
              echo "### $(basename "$z")"
              echo "- size: $(du -h "$z" | cut -f1)"
              echo "- contains hotinstall: $(unzip -l "$z" | grep -c 'hotinstall\.sh$' || true)"
              echo "- contains hot_update: $(unzip -l "$z" | grep -c 'hot_update\.sh$' || true)"
              echo
              echo '```'
              unzip -l "$z" | sed -n '1,40p'
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
          for z in "${zips[@]}"; do
            unzip -l "$z" | grep -q 'hotinstall\.sh$' || { echo "missing hotinstall.sh in $z"; exit 1; }
            unzip -l "$z" | grep -q 'bin/lib/hot_update\.sh$' || { echo "missing hot_update.sh in $z"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: magisk-module-${{ github.sha }}
          path: release/*.zip
          if-no-files-found: error
          retention-days: 14
