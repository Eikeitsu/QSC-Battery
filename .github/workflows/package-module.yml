name: Package Module

# 说明：曾出现仅改 module/bin/... 时 paths: module/** 未触发的情况。
# 主分支改为 paths-ignore（只跳过纯文档），避免漏打 zip。

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".gitignore"
      - "LICENSE"
      - ".husky/**"
  pull_request:
    branches: [main, master]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".gitignore"
      - "LICENSE"
      - ".husky/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-module-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-node-npm

      - uses: ./.github/actions/build-native

      - uses: ./.github/actions/setup-android

      - name: Build companion release APK
        working-directory: app
        run: |
          ./gradlew :app:assembleRelease --stacktrace
          mkdir -p ../release
          cp app/build/outputs/apk/release/app-release.apk ../release/QSC-Battery.apk

      - name: Build all module zips (full / rust / c / sh / lite)
        env:
          REQUIRE_COMPANION_APK: "1"
        run: npm run build:module:all

      - name: Verify module zips
        run: npm run verify:zips

      - uses: actions/upload-artifact@v4
        with:
          name: magisk-module-${{ github.sha }}
          path: release/*.zip
          if-no-files-found: error
          retention-days: 14
